<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | OmusuBI サービス連携</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍙</text></svg>">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="login-header">
        <div class="login-logo">
          <span class="logo-icon">🍙</span>
          <div class="logo-text">
            <h1>OmusuBI</h1>
            <p>Boundless Identity Orchestration</p>
          </div>
        </div>
        <h2>サービス連携ポータル</h2>
        <p class="login-subtitle">
          OmusuBI アカウントでログインして、Discord 連携および開発者権限の同期を行います。
        </p>
      </div>

      <form id="login-form" class="form">
        <div class="form-group">
          <label for="login-username">ユーザー名 (またはメールアドレス)</label>
          <input type="text" id="login-username" name="username" placeholder="例: yamada" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label for="login-password">パスワード</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-login" id="btn-login-submit">
          <span class="btn-text">OmusuBI でログイン</span>
        </button>
      </form>

      <div id="login-alert-box" class="alert alert-error" style="display: none;"></div>

      <div class="login-footer-links">
        <a href="https://www.nigiri-rice.com/terms-of-service/" target="_blank" rel="noopener">利用規約</a>
        <span class="sep">•</span>
        <a href="https://www.nigiri-rice.com/privacy-policy/" target="_blank" rel="noopener">プライバシーポリシー</a>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
